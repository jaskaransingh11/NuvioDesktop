name: JJ NuvioMobile Multirange Prototype

on:
  push:
    branches: [feature/mobile-multirange-prototype-20260929]
    paths:
      - "ports/nuvio-mobile/**"
      - ".github/workflows/jj-android-multirange.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jj-nuvio-mobile-multirange-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-host-tests-and-apk:
    name: Android host tests and isolated debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      # The Desktop fork contains a legacy gitlink without matching .gitmodules
      # metadata. actions/checkout fails its submodule cleanup even with
      # submodules=false, so fetch only the committed patch from the public repo.
      - name: Fetch committed Android patch
        run: |
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/ports/nuvio-mobile/android-multirange.patch" \
            --output android-multirange.patch
          test -s android-multirange.patch

      - name: Checkout pinned NuvioMobile source
        run: |
          git clone --quiet --depth 1 --filter=blob:none --branch cmp-rewrite https://github.com/NuvioMedia/NuvioMobile.git mobile
          cd mobile
          git fetch --quiet --depth 1 origin fc4608d2928c805fdf368399bff39f17bb55b4da
          git checkout --quiet --detach fc4608d2928c805fdf368399bff39f17bb55b4da
          git apply --check ../android-multirange.patch
          git apply ../android-multirange.patch
          touch local.properties

      # Nuvio publishes its official cloud URL and PUBLIC client key in
      # self-host/.env.example; do not use a service-role key or user credentials.
      - name: Configure official public client
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/NuvioMedia/self-host/39ea2bd1bc71636127f9d797599c23b4236960c4/.env.example \
            --output nuvio-official-public.env
          url="$(sed -n 's/^NUVIO_CLOUD_URL=//p' nuvio-official-public.env | head -n 1)"
          key="$(sed -n 's/^NUVIO_CLOUD_PUBLISHABLE_KEY=//p' nuvio-official-public.env | head -n 1)"
          test "$url" = "https://api.nuvio.tv"
          [[ "$key" =~ ^sb_publishable_[A-Za-z0-9_-]{20,200}$ ]] || exit 1
          {
            printf 'NUVIO_SUPABASE_URL=%s\n' "$url"
            printf 'NUVIO_SUPABASE_ANON_KEY=%s\n' "$key"
          } >> "$GITHUB_ENV"
          echo "Configured public official Nuvio client (key omitted from logs)."

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      # The baseline full host suite has five separate failures outside this
      # download subsystem on upstream fc4608d. Run focused transfer and
      # worker regressions first; do not misreport the full suite as green.
      - name: Android download-focused host tests
        working-directory: mobile
        run: |
          ./gradlew :composeApp:testAndroidHostTest \
            --tests '*AndroidMultiRangeTransferTest' \
            --tests '*AndroidDownloadTransferTest' \
            --tests '*DownloadsTransferWorkerTest' \
            -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore \
            --no-daemon --max-workers=2 --stacktrace

      - name: Isolated fullDebug APK
        working-directory: mobile
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --no-daemon --max-workers=2 --stacktrace

      - name: Upload test APK
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-mobile-multirange-unverified-${{ github.run_id }}
          path: mobile/androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk
          if-no-files-found: error
          retention-days: 7
