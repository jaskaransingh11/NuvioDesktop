name: JJ Windows Validation

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to validate
        required: true
        type: string
        default: Dev
      package_msi:
        description: Also build and upload the Windows MSI
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out requested ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Create local build config
        shell: pwsh
        run: New-Item -ItemType File -Path local.properties -Force | Out-Null

      - name: Constrain Gradle memory for hosted Windows runner
        shell: pwsh
        run: |
          $content = Get-Content gradle.properties
          $content = $content -replace '^org\.gradle\.jvmargs=.*$', 'org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m'
          $content = $content -replace '^kotlin\.daemon\.jvmargs=.*$', 'kotlin.daemon.jvmargs=-Xmx3072M'
          $content += 'kotlin.compiler.execution.strategy=in-process'
          Set-Content gradle.properties $content

      - name: Compile desktop
        shell: pwsh
        run: .\gradlew.bat :composeApp:compileKotlinDesktop --no-daemon --max-workers=2

      - name: Build Windows MSI
        if: inputs.package_msi
        shell: pwsh
        run: .\gradlew.bat :composeApp:packageReleaseMsi --no-daemon --max-workers=2

      - name: Upload MSI
        if: inputs.package_msi
        uses: actions/upload-artifact@v6
        with:
          name: nuvio-windows-msi-${{ github.run_id }}
          path: composeApp/build/compose/binaries/main-release/msi/*.msi
          if-no-files-found: error
