name: JJ Isolated Desktop Auth Validation

on:
  push:
    branches: [fix/desktop-test-auth-storage-20260927, fix/download-container-extension-20260927, fix/production-resume-guards-20260928, release/nuvio-1.1.27-canary-20260928, fix/nuvio-nondestructive-enqueue-20260928]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out this exact branch commit
        uses: actions/checkout@v6
        with:
          lfs: false
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Read-only Gradle dependency cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Validate protected login client config
        shell: pwsh
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUVIO_SUPABASE_URL) -or -not $env:NUVIO_SUPABASE_URL.Trim().StartsWith('https://')) {
            throw 'Missing or invalid NUVIO_SUPABASE_URL. Refuse to build a login-disabled MSI.'
          }
          if ([string]::IsNullOrWhiteSpace($env:NUVIO_SUPABASE_ANON_KEY) -or $env:NUVIO_SUPABASE_ANON_KEY.Trim().Length -lt 80) {
            throw 'Missing NUVIO_SUPABASE_ANON_KEY. Refuse to build a login-disabled MSI.'
          }
          $entries = @(
            'NUVIO_SUPABASE_URL=' + $env:NUVIO_SUPABASE_URL.Trim()
            'NUVIO_SUPABASE_ANON_KEY=' + $env:NUVIO_SUPABASE_ANON_KEY.Trim()
          )
          [System.IO.File]::WriteAllLines((Join-Path (Get-Location).Path 'local.properties'), [string[]]$entries, [System.Text.UTF8Encoding]::new($false))
          Write-Output 'Required public client config injected privately; values withheld.'
      - name: Limit Gradle RAM
        shell: pwsh
        run: |
          $content = Get-Content gradle.properties
          $content = $content -replace '^org\.gradle\.jvmargs=.*$', 'org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m'
          $content = $content -replace '^kotlin\.daemon\.jvmargs=.*$', 'kotlin.daemon.jvmargs=-Xmx3072M'
          $content += 'kotlin.compiler.execution.strategy=in-process'
          Set-Content gradle.properties $content
      - name: Compile desktop
        shell: pwsh
        run: .\gradlew.bat :composeApp:compileKotlinDesktop --no-configuration-cache --no-daemon --max-workers=2
      - name: Run pure desktop auth-isolation tests without native player bridge
        shell: pwsh
        run: .\gradlew.bat :composeApp:desktopTest --tests "com.nuvio.app.core.network.PlatformAuthSessionManagerTest" -x :composeApp:buildWindowsPlayerBridge --no-configuration-cache --no-daemon --max-workers=2
      - name: Run download filename extension regression tests
        shell: pwsh
        run: .\gradlew.bat :composeApp:desktopTest --tests "com.nuvio.app.features.downloads.*" -x :composeApp:buildWindowsPlayerBridge --no-configuration-cache --no-daemon --max-workers=2
      - name: Fetch native Windows runtime from Git LFS
        shell: bash
        run: |
          git lfs pull --include="composeApp/src/desktopMain/native/windows/runtime/**,composeApp/src/desktopMain/resources/torrserver/windows-amd64/TorrServer.exe" --exclude=""
          test -s composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll
          test -s composeApp/src/desktopMain/resources/torrserver/windows-amd64/TorrServer.exe
      - name: Install WebView2 native SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.4078.44 -OutputDirectory "$env:RUNNER_TEMP\nuget" -DirectDownload -NonInteractive -NoCache
          $root = Join-Path $env:RUNNER_TEMP 'nuget\Microsoft.Web.WebView2.1.0.4078.44'
          $linkerLibrary = Join-Path $root 'build\native\x64\WebView2Loader.dll.lib'
          if (-not (Test-Path -LiteralPath $linkerLibrary)) { throw 'WebView2 import library unavailable' }
          "WEBVIEW2_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare checksummed aria2 Windows runtime and license
        shell: pwsh
        run: .\.github\scripts\prepare-aria2-windows.ps1
      - name: Build standalone MSI with validated client config
        shell: pwsh
        run: .\gradlew.bat :composeApp:packageReleaseMsi "-Pnuvio.desktop.versionName=1.1.27" "-Pnuvio.desktop.versionCode=27" "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" "-Pcompose.desktop.packaging.checkJdkVendor=false" --no-configuration-cache --no-daemon --max-workers=2
      - name: Verify packaged aria2 executable and license by MSI extraction
        shell: pwsh
        run: |
          $msi = Get-ChildItem composeApp/build/compose/release-msis/*.msi | Select-Object -First 1
          if (-not $msi) { throw 'Expected Nuvio canary MSI missing' }
          $winInstaller = New-Object -ComObject WindowsInstaller.Installer
          $db = $winInstaller.OpenDatabase($msi.FullName, 0)
          function Read-MsiProperty([string]$name) {
            $view = $db.OpenView("SELECT Value FROM Property WHERE Property='$name'")
            try {
              $view.Execute()
              $record = $view.Fetch()
              if (-not $record) { throw "MSI missing expected property: $name" }
              return $record.StringData(1)
            } finally {
              $view.Close()
            }
          }
          if ((Read-MsiProperty 'ProductVersion') -ne '1.1.27') { throw 'MSI is not version 1.1.27' }
          if ((Read-MsiProperty 'UpgradeCode') -ne '{395990EE-9B8A-3548-922C-E7A23A495B8D}') {
            throw 'MSI UpgradeCode differs from the installed 1.1.26 product'
          }
          if ((Read-MsiProperty 'ProductCode') -eq '{47543BAA-CD50-3953-8556-D4EF6DE8508B}') {
            throw 'Canary MSI ProductCode collides with installed 1.1.26'
          }
          Write-Output 'Verified distinct 1.1.27 ProductCode and preserved upgrade lineage.'
          $target = Join-Path $env:RUNNER_TEMP 'jj-msi-aria2-acceptance'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $msiCommand = @('/a', ('"' + $msi.FullName + '"'), '/qn', ('TARGETDIR="' + $target + '"'))
          $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList $msiCommand
          if ($install.ExitCode -ne 0) { throw "MSI administrative extraction failed: $($install.ExitCode)" }
          $packed = @(Get-ChildItem $target -File -Recurse -Filter aria2c.exe)
          if ($packed.Count -ne 1) { throw "Expected exactly one bundled aria2 executable, found $($packed.Count)" }
          $from = 'composeApp/packageResources/windows/tools/aria2c.exe'
          if ((Get-FileHash $packed[0].FullName -Algorithm SHA256).Hash -ne (Get-FileHash $from -Algorithm SHA256).Hash) {
            throw 'Packed aria2 binary hash differs from verified upstream executable'
          }
          $license = @(Get-ChildItem $target -File -Recurse -Filter COPYING | Where-Object {$_.FullName -match 'aria2'})
          if ($license.Count -lt 1) { throw 'Aria2 GPL notice missing from MSI' }
          Write-Output 'Verified signed-off aria2 binary and required copyright license notice in extracted MSI.'
      - name: Upload standalone MSI only
        uses: actions/upload-artifact@v6
        with:
          name: nuvio-isolated-auth-msi-${{ github.run_id }}
          path: composeApp/build/compose/release-msis/*.msi
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
