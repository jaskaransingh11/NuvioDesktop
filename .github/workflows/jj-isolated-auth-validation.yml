name: JJ Isolated Desktop Auth Validation

on:
  push:
    branches: [fix/desktop-test-auth-storage-20260927]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Check out this exact branch commit
        uses: actions/checkout@v6
        with:
          lfs: false
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Read-only Gradle dependency cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Create disposable local build config
        shell: pwsh
        run: New-Item -ItemType File -Path local.properties -Force | Out-Null
      - name: Limit Gradle RAM
        shell: pwsh
        run: |
          $content = Get-Content gradle.properties
          $content = $content -replace '^org\.gradle\.jvmargs=.*$', 'org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m'
          $content = $content -replace '^kotlin\.daemon\.jvmargs=.*$', 'kotlin.daemon.jvmargs=-Xmx3072M'
          $content += 'kotlin.compiler.execution.strategy=in-process'
          Set-Content gradle.properties $content
      - name: Compile desktop
        shell: pwsh
        run: .\gradlew.bat :composeApp:compileKotlinDesktop --no-configuration-cache --no-daemon --max-workers=2
      - name: Run pure desktop auth-isolation tests without native player bridge
        shell: pwsh
        run: .\gradlew.bat :composeApp:desktopTest --tests "com.nuvio.app.core.network.PlatformAuthSessionManagerTest" -x :composeApp:buildWindowsPlayerBridge --no-configuration-cache --no-daemon --max-workers=2
